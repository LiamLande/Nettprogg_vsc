[workspace]
resolver = "2"
members = [
    "crdt-core",
    "crdt-wasm",
    "protocol",
    "relay-server",
    "signaling-server",
]
default-members = [
    "crdt-core",
    "protocol",
    "relay-server",
    "signaling-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/liveshare-lite"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# In-workspace dependencies
crdt-core = { path = "crdt-core" }
protocol = { path = "protocol" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
